<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Code Generator</title>
  <style>
    body {
      background-color: #0f1117;
      color: #e4e4e4;
      font-family: "Fira Code", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      font-weight: 600;
      color: #00ffcc;
    }
    .editor-container {
      width: 80%;
      max-width: 900px;
      background: #1a1b26;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.2);
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #161821;
      color: #f0f0f0;
      border: 1px solid #2c2f3b;
      border-radius: 8px;
      padding: 10px;
      font-size: 15px;
      resize: none;
      outline: none;
    }
    button {
      margin-top: 12px;
      padding: 10px 20px;
      background: linear-gradient(90deg, #00ffcc, #0077ff);
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00ffcc;
    }
    pre {
      background: #0d0f14;
      padding: 15px;
      border-radius: 8px;
      color: #00ff88;
      overflow-x: auto;
      margin-top: 20px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.4em;
    }
    .loading {
      color: #ffaa00;
      margin-top: 15px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>💡 Gemini Code Generator</h1>
  <div class="editor-container">
    <textarea id="prompt" placeholder="Describe the code you want to generate..."></textarea>
    <button onclick="generateCode()">⚡ Generate Code</button>
    <div id="loading" class="loading" style="display:none;">Generating... please wait ⏳</div>
    <pre id="output"></pre>
  </div>

  <script>
    async function generateCode() {
      const prompt = document.getElementById("prompt").value.trim();
      const output = document.getElementById("output");
      const loading = document.getElementById("loading");
      
      if (!prompt) return;

      output.textContent = "";
      loading.style.display = "block";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: prompt })
        });

        const data = await res.json();
        loading.style.display = "none";

        if (data.reply) {
          output.textContent = data.reply;
        } else {
          output.textContent = "❌ Error: " + (data.error || "No response received");
        }
      } catch (err) {
        loading.style.display = "none";
        output.textContent = "⚠️ Network error: " + err.message;
      }
    }
  </script>
</body>
</html>
